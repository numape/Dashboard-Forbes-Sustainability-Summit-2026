<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App de Asistencia - Clean UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        app: {
                            bg: '#F2F4F7',       /* Fondo gris súper claro de la ref */
                            card: '#FFFFFF',     /* Blanco puro para tarjetas */
                            text: '#1C1E21',     /* Casi negro para títulos */
                            muted: '#8A92A6',    /* Gris para subtítulos e iconos */
                            accent: '#00D8A1',   /* El celeste/verde neón de la batería */
                            nav: '#1A1C20',      /* El botón negro del menú inferior */
                        }
                    },
                    boxShadow: {
                        'soft': '0 10px 40px -10px rgba(0,0,0,0.04)',
                        'nav': '0 20px 40px rgba(0,0,0,0.06)',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #E5E7EB; /* Fondo oscuro para destacar la app en PC */ }
        
        /* Oculta la barra de scroll para un look más "App" */
        ::-webkit-scrollbar { display: none; }
        
        /* Animación suave para la imagen central */
        .float-anim { animation: float 6s ease-in-out infinite; }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body class="font-sans min-h-screen flex items-center justify-center text-app-text antialiased selection:bg-app-accent selection:text-white sm:p-6">

    <!-- CONTENEDOR TIPO APP MÓVIL -->
    <main class="w-full max-w-[400px] h-[100dvh] sm:h-[850px] bg-app-bg sm:rounded-[40px] relative overflow-hidden shadow-2xl flex flex-col">
        
        <!-- Contenido scrolleable de la app -->
        <div class="flex-1 overflow-y-auto pb-28">
            
            <!-- 1. HEADER (Perfil y Saludo) -->
            <header class="flex justify-between items-center px-6 pt-12 pb-4">
                <div class="flex items-center gap-4">
                    <!-- Foto de perfil -->
                    <div class="w-12 h-12 rounded-full overflow-hidden shadow-sm">
                        <img src="https://ui-avatars.com/api/?name=Nilton+Pelaez&background=1C1E21&color=fff" alt="Perfil" class="w-full h-full object-cover">
                    </div>
                    <div>
                        <p class="text-xs font-medium text-app-muted mb-0.5">Buenos días 👋</p>
                        <h1 class="text-base font-semibold leading-tight">Nilton Peláez</h1>
                    </div>
                </div>
                <!-- Campana de notificaciones -->
                <button class="w-12 h-12 bg-white rounded-full flex items-center justify-center shadow-soft text-app-text hover:bg-gray-50 transition-colors">
                    <i class="fa-regular fa-bell text-lg"></i>
                </button>
            </header>

            <!-- 2. HERO IMAGE (Reemplaza el auto de tu referencia) -->
            <div class="px-6 py-6 flex justify-center items-center">
                <!-- Aquí puedes poner el logo de Forbes, un ticket 3D o un código QR flotante -->
                <div class="relative w-full max-w-[240px] aspect-[4/3] flex items-center justify-center float-anim">
                    <!-- Placeholder visual. Reemplazar src por tu imagen PNG transparente -->
                    <img src="https://cdn3d.iconscout.com/3d/premium/thumb/ticket-5590729-4652419.png" alt="Evento 3D" class="w-full object-contain drop-shadow-xl">
                </div>
            </div>

            <!-- 3. DASHBOARD CARDS (Estilo Batería/Distancia) -->
            <div class="px-6 grid grid-cols-2 gap-4 mb-8">
                
                <!-- Card 1: Check-ins (Estilo Batería) -->
                <div class="bg-white rounded-[28px] p-5 shadow-soft">
                    <div class="flex justify-between items-center mb-4 text-app-text">
                        <span class="text-xs font-medium">Check-ins</span>
                        <i class="fa-solid fa-qrcode text-app-muted"></i>
                    </div>
                    <h2 class="text-4xl font-bold mb-1">85</h2>
                    <!-- Barra de progreso -->
                    <div class="flex items-center gap-2 mt-2">
                        <span class="text-[10px] text-app-muted">Progreso</span>
                        <div class="flex-1 h-1.5 bg-gray-100 rounded-full overflow-hidden">
                            <div class="h-full bg-app-accent w-[60%] rounded-full"></div>
                        </div>
                    </div>
                </div>

                <!-- Card 2: Pendientes (Estilo Distancia) -->
                <div class="bg-white rounded-[28px] p-5 shadow-soft">
                    <div class="flex justify-between items-center mb-4 text-app-text">
                        <span class="text-xs font-medium">Pendientes</span>
                        <i class="fa-regular fa-clock text-app-muted"></i>
                    </div>
                    <h2 class="text-4xl font-bold mb-1">57</h2>
                    <p class="text-[10px] text-app-muted mt-2">Faltan por llegar</p>
                </div>
            </div>

            <!-- 4. LISTA DE INVITADOS (Adaptada al nuevo estilo UI) -->
            <div class="px-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-semibold text-lg">Lista de Invitados</h3>
                    <span class="text-xs font-medium text-app-muted bg-white px-3 py-1 rounded-full shadow-sm">142 Total</span>
                </div>

                <!-- Buscador Clean -->
                <div class="relative mb-6">
                    <i class="fa-solid fa-search absolute left-4 top-1/2 transform -translate-y-1/2 text-app-muted text-sm"></i>
                    <input type="text" id="searchInput" placeholder="Buscar por nombre..." class="w-full bg-white rounded-2xl py-3.5 pl-11 pr-4 text-sm focus:outline-none focus:ring-2 focus:ring-app-accent shadow-soft transition-all placeholder:text-gray-400">
                </div>

                <!-- Items de la lista -->
                <div class="space-y-3" id="guestList">
                    <!-- Invitado 1 -->
                    <div class="bg-white p-3 rounded-2xl flex items-center justify-between shadow-soft guest-item">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-app-accent/10 flex items-center justify-center text-app-accent font-bold text-sm">
                                CR
                            </div>
                            <div>
                                <p class="text-sm font-semibold text-app-text">Carlos Romero</p>
                                <p class="text-[10px] text-app-muted">TechCorp • Pendiente</p>
                            </div>
                        </div>
                        <!-- Botón de acción minimalista -->
                        <button class="w-8 h-8 rounded-full bg-app-bg text-app-text flex items-center justify-center hover:bg-app-accent hover:text-white transition-colors">
                            <i class="fa-solid fa-chevron-right text-xs"></i>
                        </button>
                    </div>

                    <!-- Invitado 2 (Ya asistió) -->
                    <div class="bg-white p-3 rounded-2xl flex items-center justify-between shadow-soft guest-item opacity-60">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center text-gray-500 font-bold text-sm">
                                MG
                            </div>
                            <div>
                                <p class="text-sm font-semibold text-app-text line-through">María García</p>
                                <p class="text-[10px] text-app-muted">Sustain PE • Asistió</p>
                            </div>
                        </div>
                        <i class="fa-solid fa-check-circle text-app-accent"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- 5. BOTTOM NAVIGATION BAR (Exactamente igual a la referencia) -->
        <div class="absolute bottom-6 left-1/2 -translate-x-1/2 w-[calc(100%-3rem)] bg-white rounded-[2rem] p-2 flex justify-between items-center shadow-nav z-50">
            <!-- Botón Activo (Negro con ícono verde) -->
            <button class="w-[72px] h-[60px] bg-app-nav rounded-[1.5rem] flex items-center justify-center">
                <i class="fa-solid fa-house text-app-accent text-xl"></i>
            </button>
            
            <!-- Botones inactivos (Íconos de línea negros/grises) -->
            <button class="flex-1 h-[60px] flex items-center justify-center text-app-text hover:text-app-accent transition-colors">
                <i class="fa-solid fa-expand text-xl"></i> <!-- Escanear -->
            </button>
            
            <button class="flex-1 h-[60px] flex items-center justify-center text-app-text hover:text-app-accent transition-colors">
                <i class="fa-regular fa-address-book text-xl"></i> <!-- Lista completa -->
            </button>
            
            <button class="flex-1 h-[60px] flex items-center justify-center text-app-text hover:text-app-accent transition-colors">
                <i class="fa-solid fa-gear text-xl"></i> <!-- Ajustes -->
            </button>
        </div>

    </main>

    <!-- Script de búsqueda simple adaptado -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const searchInput = document.getElementById("searchInput");
            const items = document.getElementsByClassName("guest-item");

            searchInput.addEventListener("keyup", function(event) {
                const query = event.target.value.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                for (let i = 0; i < items.length; i++) {
                    const text = items[i].textContent.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                    items[i].style.display = text.includes(query) ? "flex" : "none";
                }
            });
        });
    </script>
</body>
</html>
